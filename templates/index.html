<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>BuscaFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🎬 BuscaFlix</h1>
        <form method="GET" action="/">
            <input type="text" name="titulo" placeholder="Digite o nome do filme ou série">
            <button type="submit">Buscar</button>
        </form>

        {% if erro %}
        <p class="erro">Nenhum resultado encontrado. Tente outro título.</p>
        {% endif %}

        {% if resultados %}
        <div class="lista-resultados">
            {% for item in resultados %}
            <a href="/filme/{{ item['imdbID'] }}" class="resultado-item">
                {% if item['Poster'] != 'N/A' %}
                <img src="{{ item['Poster'] }}" alt="Pôster">
                {% else %}
                <div class="sem-poster">Sem imagem</div>
                {% endif %}
                <h3>{{ item['Title'] }} ({{ item['Year'] }})</h3>
            </a>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
